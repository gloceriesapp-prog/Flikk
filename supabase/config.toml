# Local Supabase for development: `supabase start` (needs Docker), then apply our
# migrations with backend/scripts/db-migrate.mjs (see ENVIRONMENTS.md).
# Schema lives in backend/migrations, not supabase/migrations.
project_id = "flikk-local"

[api]
port = 54321

[db]
port = 54322
major_version = 17

[studio]
port = 54323

# Off locally: the analytics (Logflare) container needs the default Docker
# socket, which Docker Desktop on macOS often doesn't expose; its failed
# health check aborts `supabase start`. Nothing in the app uses it.
[analytics]
enabled = false

# Test data comes from backend/seed/dev-seed.sql via `npm run local:setup`.
[db.seed]
enabled = false

[auth]
site_url = "http://localhost:3000"

[auth.sms]
enable_signup = true
enable_confirmations = true

# Fixed OTPs so phone login works locally without sending SMS.
# Log in with any of these numbers and the code shown.
[auth.sms.test_otp]
919100000001 = "123456"
919100000002 = "123456"
919100000003 = "123456"

# Login SMS goes through the same path as production: Supabase calls our
# backend's Send SMS hook, which sends through MSG91. Local Supabase runs in
# Docker, so it reaches the backend on this machine via host.docker.internal.
# The secret comes from supabase/.env (written by `npm run local:setup`) and
# must equal SEND_SMS_HOOK_SECRET in backend/.env.local. The test numbers
# above never trigger the hook, so they work without MSG91 or the backend.
[auth.hook.send_sms]
enabled = true
uri = "http://host.docker.internal:4000/auth/hooks/send-sms"
secrets = "env(SEND_SMS_HOOK_SECRET)"
