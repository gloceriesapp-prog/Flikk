# Builds the backend image on GitHub (the 2 GB server never compiles) and
# deploys it to the Lightsail instance. Off until the repository variable
# LIGHTSAIL_DEPLOY is "true", so it never races Railway during the move.
#
# Repository settings needed:
#   variables: LIGHTSAIL_DEPLOY=true, API_DOMAIN=api.gloceries.com
#   secrets:   LIGHTSAIL_HOST (static IP), LIGHTSAIL_SSH_KEY (private key of a
#              key pair whose public half is in ~ubuntu/.ssh/authorized_keys),
#              LIGHTSAIL_KNOWN_HOSTS (verified SSH host key, never blind keyscan)
name: Backend → Lightsail

on:
  push:
    branches: [main]
    paths: [backend/**, packages/server-media/**, packages/home-content/**, packages/promotions/**, .github/workflows/backend-lightsail.yml]
  pull_request:
    paths: [backend/deploy/lightsail/**, .github/workflows/backend-lightsail.yml]
  workflow_dispatch:
    inputs:
      build_only:
        description: Build a bootstrap image artifact without accessing the server
        type: boolean
        default: false

concurrency: {group: backend-lightsail, cancel-in-progress: false}

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
      - name: Validate deployment scripts
        run: |
          bash -n backend/deploy/lightsail/setup.sh backend/deploy/lightsail/deploy.sh
          bash backend/deploy/lightsail/test-deploy.sh
      - name: Validate Compose configuration
        env:
          TAG: ${{ github.sha }}
          API_DOMAIN: api.gloceries.com
        run: |
          scratch=$(mktemp -d)
          trap 'rm -rf "$scratch"' EXIT
          cp backend/deploy/lightsail/{docker-compose.yml,Caddyfile} "$scratch/"
          touch "$scratch/.env"
          docker compose --project-directory "$scratch" config --quiet

  deploy:
    needs: validate
    if: (github.event_name == 'workflow_dispatch' && inputs.build_only) || (github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.LIGHTSAIL_DEPLOY == 'true')
    runs-on: ubuntu-latest
    permissions: {contents: read, packages: write}
    env:
      IMAGE: ghcr.io/gloceriesapp-prog/flikk-backend
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: ${{ !inputs.build_only }}
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: ${{ !inputs.build_only }}
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          outputs: ${{ inputs.build_only && 'type=docker,dest=/tmp/backend-image.tar' || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Save bootstrap image
        if: inputs.build_only
        uses: actions/upload-artifact@v4
        with:
          name: backend-image-${{ github.sha }}
          path: /tmp/backend-image.tar
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

      - name: Deploy
        if: ${{ !inputs.build_only }}
        env:
          SSH_KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          HOST: ${{ secrets.LIGHTSAIL_HOST }}
          TAG: ${{ github.sha }}
          KNOWN_HOSTS: ${{ secrets.LIGHTSAIL_KNOWN_HOSTS }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "$SSH_KEY" && -n "$KNOWN_HOSTS" && "$HOST" =~ ^[a-zA-Z0-9.-]+$ ]]
          key_dir=$(mktemp -d)
          trap 'rm -rf "$key_dir"' EXIT
          printf '%s\n' "$SSH_KEY" > "$key_dir/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$key_dir/known_hosts"
          chmod 600 "$key_dir/"*
          opts=(-i "$key_dir/key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$key_dir/known_hosts")
          ssh "${opts[@]}" ubuntu@"$HOST" "mkdir -p /opt/gloceries/releases/$TAG"
          scp "${opts[@]}" backend/deploy/lightsail/{docker-compose.yml,Caddyfile,deploy.sh} "ubuntu@$HOST:/opt/gloceries/releases/$TAG/"
          # Ephemeral job token: no persistent registry PAT on the host.
          # The token is sent on stdin, never in the remote command or logs.
          printf '%s' "$GHCR_TOKEN" | ssh "${opts[@]}" ubuntu@"$HOST" \
            "set -eu; export DOCKER_CONFIG=\$(mktemp -d); trap 'rm -rf \"\$DOCKER_CONFIG\"' EXIT; docker login ghcr.io -u '${{ github.actor }}' --password-stdin; bash /opt/gloceries/releases/$TAG/deploy.sh $TAG"

      - name: Health check
        if: ${{ !inputs.build_only }}
        env: {HOST: "${{ secrets.LIGHTSAIL_HOST }}"}
        run: |
          for i in $(seq 1 20); do
            code=$(curl -fsS -o /dev/null -w '%{http_code}' --resolve "${{ vars.API_DOMAIN }}:443:$HOST" "https://${{ vars.API_DOMAIN }}/" || true)
            [ "$code" = "200" ] && echo "API healthy" && exit 0
            sleep 6
          done
          echo "API did not answer 200 after deploy" && exit 1
