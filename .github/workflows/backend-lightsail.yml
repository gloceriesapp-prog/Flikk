# Builds the backend image on GitHub (the 2 GB server never compiles) and
# deploys it to the Lightsail instance. Off until the repository variable
# LIGHTSAIL_DEPLOY is "true", so it never races Railway during the move.
#
# Repository settings needed:
#   variables: LIGHTSAIL_DEPLOY=true, API_DOMAIN=api.gloceries.com
#   secrets:   LIGHTSAIL_HOST (static IP), LIGHTSAIL_SSH_KEY (private key of a
#              key pair whose public half is in ~ubuntu/.ssh/authorized_keys)
name: Backend → Lightsail

on:
  push:
    branches: [main]
    paths: [backend/**, packages/server-media/**, packages/home-content/**, packages/promotions/**]
  workflow_dispatch:

concurrency: {group: backend-lightsail, cancel-in-progress: false}

jobs:
  deploy:
    if: vars.LIGHTSAIL_DEPLOY == 'true'
    runs-on: ubuntu-latest
    permissions: {contents: read, packages: write}
    env:
      IMAGE: ghcr.io/gloceriesapp-prog/flikk-backend
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }},${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy
        env:
          SSH_KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          HOST: ${{ secrets.LIGHTSAIL_HOST }}
          TAG: ${{ github.sha }}
        run: |
          install -m 600 /dev/null key && printf '%s\n' "$SSH_KEY" > key
          ssh -i key -o StrictHostKeyChecking=accept-new ubuntu@"$HOST" \
            "cd /opt/gloceries && TAG=$TAG docker compose pull api worker && TAG=$TAG docker compose up -d && docker image prune -f"
          rm -f key

      - name: Health check
        env: {HOST: "${{ secrets.LIGHTSAIL_HOST }}"}
        run: |
          for i in $(seq 1 20); do
            code=$(curl -fsS -o /dev/null -w '%{http_code}' --resolve "${{ vars.API_DOMAIN }}:443:$HOST" "https://${{ vars.API_DOMAIN }}/" || true)
            [ "$code" = "200" ] && echo "API healthy" && exit 0
            sleep 6
          done
          echo "API did not answer 200 after deploy" && exit 1
