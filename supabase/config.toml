# Local Supabase for development: `supabase start` (needs Docker), then apply our
# migrations with backend/scripts/db-migrate.mjs (see ENVIRONMENTS.md).
# Schema lives in backend/migrations, not supabase/migrations.
project_id = "flikk-local"

[api]
port = 54321

[db]
port = 54322
major_version = 17

[studio]
port = 54323

[auth]
site_url = "http://localhost:3000"

[auth.sms]
enable_signup = true
enable_confirmations = true

# No fixed login OTPs. Real-message testing uses the signed staging SMS hook;
# isolated automated tests mock the transport without issuing real sessions.
