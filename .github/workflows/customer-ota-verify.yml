name: Customer OTA Device QA

# Records operator/runner evidence from a real matching preview installation.
on:
  workflow_dispatch:
    inputs:
      platform:
        type: choice
        options: [android, ios]
        required: true
        description: 'Platform physically tested'
      preview_run_id:
        type: string
        required: true
        description: 'Successful preview update or preview rollback run'
      installed_update_id:
        type: string
        required: true
        description: 'Exact updateId from the GLOCERIES_OTA_QA device log'
      installed_runtime_version:
        type: string
        required: true
        description: 'Exact runtimeVersion from the same device log'
      device_model:
        type: string
        required: true
        description: 'Model only, e.g. iPhone 16 or Pixel 9 (no names/serials)'
      passed_checks:
        type: string
        required: true
        description: 'JSON list: launch-login, home-maps, cart-checkout, payment-return, tracking-resume'
      confirm_physical_test:
        type: boolean
        default: false
        description: 'I tested these flows on the exact preview update on a physical device'
permissions:
  contents: read
  actions: read
jobs:
  record:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      OTA_PLATFORM: ${{ inputs.platform }}
      QA_PREVIEW_ID: ${{ inputs.preview_run_id }}
      QA_UPDATE_ID: ${{ inputs.installed_update_id }}
      QA_RUNTIME: ${{ inputs.installed_runtime_version }}
      QA_DEVICE_MODEL: ${{ inputs.device_model }}
      QA_CHECKS: ${{ inputs.passed_checks }}
      QA_CONFIRMED: ${{ inputs.confirm_physical_test }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch preview provenance
        run: |
          set -euo pipefail
          [[ "$QA_PREVIEW_ID" =~ ^[1-9][0-9]*$ ]] || exit 1
          echo "OTA_PREVIEW_REPORT=$RUNNER_TEMP/preview/ota-report.json" >> "$GITHUB_ENV"
          echo "OTA_PREVIEW_RUN=$RUNNER_TEMP/preview-run.json" >> "$GITHUB_ENV"
          echo "OTA_QA_REPORT=$RUNNER_TEMP/device-qa.json" >> "$GITHUB_ENV"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$QA_PREVIEW_ID" > "$RUNNER_TEMP/preview-run.json"
          gh run download "$QA_PREVIEW_ID" --repo "$GITHUB_REPOSITORY" \
            --pattern "customer-ota*preview-$OTA_PLATFORM-*" --dir "$RUNNER_TEMP/preview-download"
          find "$RUNNER_TEMP/preview-download" -name ota-report.json -type f > "$RUNNER_TEMP/report-paths"
          test "$(wc -l < "$RUNNER_TEMP/report-paths" | tr -d ' ')" = 1 || exit 1
          mkdir -p "$RUNNER_TEMP/preview"
          cp "$(cat "$RUNNER_TEMP/report-paths")" "$RUNNER_TEMP/preview/ota-report.json"
      - name: Verify exact installed update and completed test coverage
        run: node apps/customer/scripts/ota/device-qa.cjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: customer-ota-qa-${{ inputs.platform }}-${{ inputs.preview_run_id }}
          path: ${{ runner.temp }}/device-qa.json
          if-no-files-found: error
          retention-days: 90
