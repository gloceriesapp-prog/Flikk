# Desired infrastructure for a NEW host. The current host was provisioned in
# the signed-in console; do not create a duplicate stack or replace it blindly.
AWSTemplateFormatVersion: '2010-09-09'
Description: Gloceries production API host in Mumbai
Parameters:
  UbuntuBlueprintId:
    Type: String
    Description: Current Ubuntu 24.04 Lightsail blueprint ID from the regional catalog
  BundleId:
    Type: String
    Description: Current dual-stack 2 GB 12 USD Lightsail bundle ID from the regional catalog
  InstanceName:
    Type: String
    Default: gloceries-api
  KeyPairName:
    Type: String
    Description: Existing Mumbai SSH key pair name
Resources:
  ApiInstance:
    Type: AWS::Lightsail::Instance
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      InstanceName: !Ref InstanceName
      AvailabilityZone: ap-south-1a
      BlueprintId: !Ref UbuntuBlueprintId
      BundleId: !Ref BundleId
      KeyPairName: !Ref KeyPairName
      AddOns:
        - AddOnType: AutoSnapshot
          Status: Enabled
          AutoSnapshotAddOnRequest:
            SnapshotTimeOfDay: '00:00'
      Networking:
        Ports:
          - FromPort: 22
            ToPort: 22
            Protocol: tcp
            CidrListAliases: [lightsail-connect]
          # Web ports accept only Cloudflare (api.gloceries.com is proxied);
          # same list as the Caddyfile's trusted_proxies.
          - FromPort: 80
            ToPort: 80
            Protocol: tcp
            Cidrs: [173.245.48.0/20, 103.21.244.0/22, 103.22.200.0/22, 103.31.4.0/22, 141.101.64.0/18, 108.162.192.0/18, 190.93.240.0/20, 188.114.96.0/20, 197.234.240.0/22, 198.41.128.0/17, 162.158.0.0/15, 104.16.0.0/13, 104.24.0.0/14, 172.64.0.0/13, 131.0.72.0/22]
            Ipv6Cidrs: ['2400:cb00::/32', '2606:4700::/32', '2803:f800::/32', '2405:b500::/32', '2405:8100::/32', '2a06:98c0::/29', '2c0f:f248::/32']
          - FromPort: 443
            ToPort: 443
            Protocol: tcp
            Cidrs: [173.245.48.0/20, 103.21.244.0/22, 103.22.200.0/22, 103.31.4.0/22, 141.101.64.0/18, 108.162.192.0/18, 190.93.240.0/20, 188.114.96.0/20, 197.234.240.0/22, 198.41.128.0/17, 162.158.0.0/15, 104.16.0.0/13, 104.24.0.0/14, 172.64.0.0/13, 131.0.72.0/22]
            Ipv6Cidrs: ['2400:cb00::/32', '2606:4700::/32', '2803:f800::/32', '2405:b500::/32', '2405:8100::/32', '2a06:98c0::/29', '2c0f:f248::/32']
      Tags:
        - Key: Service
          Value: gloceries-backend
        - Key: Environment
          Value: production
  StaticIp:
    Type: AWS::Lightsail::StaticIp
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      StaticIpName: gloceries-api-ip
      AttachedTo: !Ref ApiInstance
Outputs:
  StaticAddress:
    Value: !GetAtt StaticIp.IpAddress
