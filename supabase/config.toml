# Local Supabase for development: `supabase start` (needs Docker), then apply our
# migrations with backend/scripts/db-migrate.mjs (see ENVIRONMENTS.md).
# Schema lives in backend/migrations, not supabase/migrations.
project_id = "flikk-local"

[api]
port = 54321

[db]
port = 54322
major_version = 17

[studio]
port = 54323

# Off locally: the analytics (Logflare) container needs the default Docker
# socket, which Docker Desktop on macOS often doesn't expose; its failed
# health check aborts `supabase start`. Nothing in the app uses it.
[analytics]
enabled = false

# Test data comes from backend/seed/dev-seed.sql via `npm run local:setup`.
[db.seed]
enabled = false

[auth]
site_url = "http://localhost:3000"

# Phone sign-in must stay enabled: after the backend checks the login code it
# signs the user in with phone + a one-time password (backend/src/auth/loginOtp.ts).
# Supabase no longer sends or checks login SMS codes itself, so there is no
# Send SMS hook, SMS provider or test_otp list here. The test numbers
# (9100000001/2/3, code 123456) live in the backend.
[auth.sms]
enable_signup = true
enable_confirmations = true
