name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          # 22, was 20 — undici@8 (backend/src/db/supabase.ts's own Agent/
          # fetch import) throws `webidl.util.markAsUncloneable is not a
          # function` constructing its Cache API on Node 20 (real bug, not
          # a broken package — verified against npm's own published
          # versions), which crashed every test file that transitively
          # imports supabase.ts (auth.test.ts, weeklyPayouts.test.ts) before
          # a single test in them could even run. @supabase/supabase-js
          # already logs its own "Node 20 and below are deprecated, upgrade
          # to Node 22" warning in this same CI output — this makes CI
          # actually run on the version both direct dependencies expect.
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            backend/pnpm-lock.yaml
            apps/admin/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # Several backend tests import shared logic from the customer and admin
      # apps (react-query cache helpers, admin route handlers), so their
      # dependencies must exist for those test files to load.
      - run: npm ci --no-audit --no-fund
        working-directory: apps/customer
      - run: pnpm install --frozen-lockfile --ignore-workspace
        working-directory: apps/admin
      - run: node scripts/migrations.mjs
      - run: pnpm run lint
      - run: pnpm exec tsc --noEmit -p tsconfig.json
      - run: pnpm test
      - run: node --test ../packages/server-media/upload.test.cjs

  commerce-security:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        missing_delivery_otp: [false, true]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: flikk_checkout_tests
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d flikk_checkout_tests"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGDATABASE: flikk_checkout_tests
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Verify checkout and real API-role permissions
        run: >-
          psql -X -v ON_ERROR_STOP=1
          -v missing_delivery_otp=${{ matrix.missing_delivery_otp }}
          -f backend/tests/sql/checkout-eligibility.sql
          -f backend/tests/sql/commerce-security.sql
          -f backend/tests/sql/verify-commerce-security.sql
          -f backend/tests/sql/order-safety.sql
          -f backend/tests/sql/verify-order-safety.sql
      - name: Verify concurrent delivery and refund claims
        run: python3 backend/tests/sql/order-safety-concurrency.py
      - name: Verify customer experience migrations and deletion permissions
        run: psql -X -v ON_ERROR_STOP=1 -f backend/tests/sql/customer-experience.sql -f backend/tests/sql/checkout-address-snapshots.sql -f backend/tests/sql/backend-audit.sql

      - name: Verify concurrent rating totals
        run: python3 backend/tests/sql/reviews-concurrency.py
      - name: Rebuild complete application schema from canonical migrations
        if: matrix.missing_delivery_otp == false
        run: |
          createdb flikk_migrations_tests
          PGDATABASE=flikk_migrations_tests node backend/scripts/verify-fresh-migrations.mjs
          PGDATABASE=flikk_migrations_tests psql -X -v ON_ERROR_STOP=1 -f backend/tests/sql/msg91-sms-delivery.sql -f backend/tests/sql/customer-policy-sync.sql -f backend/tests/sql/rider-profile-changes.sql -f backend/tests/sql/store-team-access.sql -f backend/tests/sql/checkout-deadline-fixture-defaults.sql
          PGDATABASE=flikk_migrations_tests psql -X -v ON_ERROR_STOP=1 -f backend/tests/sql/security-patch.sql -f backend/tests/sql/browse-visibility.sql -f backend/tests/sql/media-storage.sql -f backend/tests/sql/promotional-deliveries.sql -f backend/tests/sql/verify-rpc-security.sql -f backend/tests/sql/verify-commerce-security.sql -f backend/tests/sql/verify-order-safety.sql
          PGDATABASE=flikk_migrations_tests psql -X -v ON_ERROR_STOP=1 -f backend/tests/sql/payment-refund-recovery.sql -f backend/tests/sql/trip-dispatch-integrity.sql -f backend/tests/sql/rider-pay-cod.sql -f backend/tests/sql/admin-order-control.sql -f backend/tests/sql/account-controls.sql -f backend/tests/sql/catalogue-stock-integrity.sql -f backend/tests/sql/app-config-hours.sql -f backend/tests/sql/rider-ops.sql -f backend/tests/sql/partner-store-controls.sql -f backend/tests/sql/product-review-commission.sql -f backend/tests/sql/home-content-controls.sql -f backend/tests/sql/customer-commerce-controls.sql -f backend/tests/sql/partner-rider-support.sql

      - name: Verify concurrent SMS delivery claims
        if: matrix.missing_delivery_otp == false
        run: PGDATABASE=flikk_migrations_tests python3 backend/tests/sql/msg91-sms-concurrency.py

  customer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/customer
    env:
      EXPO_PUBLIC_API_URL: https://api.example.com
      EXPO_PUBLIC_API_FOLLOW_METRO_HOST: 'false'
      CI: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/customer/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --runInBand
      - name: Bundle both native platforms
        run: npx expo export --platform ios --max-workers 2 --output-dir /tmp/customer-ios
      - run: npx expo export --platform android --max-workers 2 --output-dir /tmp/customer-android

  # Partner and rider apps share the root npm workspace (with packages/*).
  mobile-apps:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [partner, rider]
    env:
      EXPO_PUBLIC_API_URL: https://api.example.com
      CI: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
        working-directory: apps/${{ matrix.app }}
      - run: npx eslint .
        working-directory: apps/${{ matrix.app }}
      - name: Verify partner real-auth boundary
        if: matrix.app == 'partner'
        run: npm test
        working-directory: apps/partner

  # Next.js apps. `next typegen` generates the PageProps/LayoutProps/
  # RouteContext globals that the typecheck relies on.
  web-apps:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [admin, partner-dashboard, landing]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/${{ matrix.app }}/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --ignore-workspace
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npx eslint src
      - name: Verify partner login role gate
        if: matrix.app == 'partner-dashboard'
        run: node --experimental-strip-types --test tests/partnerAccess.test.mjs

