# Builds the backend image on GitHub (the 2 GB server never compiles) and
# deploys it to the Lightsail instance. Off until the repository variable
# LIGHTSAIL_DEPLOY is "true", so it never races Railway during the move.
#
# Repository settings needed:
#   variables: LIGHTSAIL_DEPLOY=true, API_DOMAIN=api.gloceries.com,
#              LIGHTSAIL_AWS_ROLE_ARN, LIGHTSAIL_INSTANCE_NAME=gloceries-api
#   secrets:   LIGHTSAIL_HOST (static IP), LIGHTSAIL_SSH_KEY (private key of a
#              key pair whose public half is in ~ubuntu/.ssh/authorized_keys),
#              LIGHTSAIL_KNOWN_HOSTS (verified SSH host key, never blind keyscan)
name: Backend → Lightsail

on:
  push:
    branches: [main]
    paths: [backend/**, packages/server-media/**, packages/home-content/**, packages/promotions/**, .github/workflows/backend-lightsail.yml]
  pull_request:
    paths: [backend/deploy/lightsail/**, .github/workflows/backend-lightsail.yml]
  workflow_dispatch:
    inputs:
      build_only:
        description: Build a bootstrap image artifact without accessing the server
        type: boolean
        default: false

concurrency: {group: backend-lightsail, cancel-in-progress: false}

jobs:
  validate:
    runs-on: ubuntu-24.04
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 - Node.js 24
      - name: Validate deployment scripts
        run: |
          bash -n backend/deploy/lightsail/setup.sh backend/deploy/lightsail/deploy.sh
          bash backend/deploy/lightsail/test-deploy.sh
          python3 backend/deploy/lightsail/test-ci-ssh-access.py
      - name: Validate deployment role template
        run: |
          python3 -m venv "$RUNNER_TEMP/cfn-validation"
          "$RUNNER_TEMP/cfn-validation/bin/pip" install --disable-pip-version-check cfn-lint==1.58.0
          "$RUNNER_TEMP/cfn-validation/bin/cfn-lint" -r ap-south-1 -t backend/deploy/lightsail/github-access.yaml
      - name: Validate Compose configuration
        env:
          TAG: ${{ github.sha }}
          API_DOMAIN: api.gloceries.com
        run: |
          scratch=$(mktemp -d)
          trap 'rm -rf "$scratch"' EXIT
          cp backend/deploy/lightsail/{docker-compose.yml,Caddyfile} "$scratch/"
          touch "$scratch/.env"
          docker compose --project-directory "$scratch" config --quiet

  deploy:
    needs: validate
    if: (github.event_name == 'workflow_dispatch' && inputs.build_only) || (github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.LIGHTSAIL_DEPLOY == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions: {contents: read, actions: read, packages: write, id-token: write}
    env:
      IMAGE: ghcr.io/gloceriesapp-prog/flikk-backend
      AWS_REGION: ap-south-1
      LIGHTSAIL_INSTANCE_NAME: ${{ vars.LIGHTSAIL_INSTANCE_NAME }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 - Node.js 24
      - name: Require the full CI suite for this exact main commit
        if: ${{ !inputs.build_only }}
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          run_id=''
          for attempt in $(seq 1 12); do
            run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" --event push --limit 1 --json databaseId --jq '.[0].databaseId // empty')
            [[ -n "$run_id" ]] && break
            sleep 5
          done
          [[ -n "$run_id" ]] || { echo 'No push CI run exists for this commit'; exit 1; }
          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status --interval 15
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: ${{ !inputs.build_only }}
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: ${{ !inputs.build_only }}
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          outputs: ${{ inputs.build_only && 'type=docker,dest=/tmp/backend-image.tar' || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Save bootstrap image
        if: inputs.build_only
        uses: actions/upload-artifact@v4
        with:
          name: backend-image-${{ github.sha }}
          path: /tmp/backend-image.tar
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

      - name: Authenticate to AWS using GitHub identity
        if: ${{ !inputs.build_only }}
        id: aws
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.LIGHTSAIL_AWS_ROLE_ARN }}
          aws-region: ap-south-1
          role-session-name: gloceries-deploy-${{ github.run_id }}
          role-duration-seconds: 3600
          allowed-account-ids: '657358297558'

      - name: Identify this runner's IPv4 address
        if: ${{ !inputs.build_only }}
        id: runner
        run: |
          set -euo pipefail
          ip=$(curl -4fsS --retry 3 --connect-timeout 10 --max-time 20 https://checkip.amazonaws.com)
          python3 - "$ip" "$GITHUB_OUTPUT" <<'PY'
          import ipaddress, sys
          address = ipaddress.ip_address(sys.argv[1].strip())
          if address.version != 4 or not address.is_global:
              raise SystemExit('Expected a public runner IPv4 address')
          with open(sys.argv[2], 'a') as output:
              output.write(f'cidr={address}/32\n')
          PY

      - name: Allow SSH only from this runner
        if: ${{ !inputs.build_only }}
        env: {RUNNER_CIDR: '${{ steps.runner.outputs.cidr }}'}
        run: python3 backend/deploy/lightsail/ci-ssh-access.py open "$RUNNER_CIDR"

      - name: Deploy
        if: ${{ !inputs.build_only }}
        env:
          SSH_KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          HOST: ${{ secrets.LIGHTSAIL_HOST }}
          TAG: ${{ github.sha }}
          KNOWN_HOSTS: ${{ secrets.LIGHTSAIL_KNOWN_HOSTS }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SENTRY_DSN: ${{ secrets.BACKEND_SENTRY_DSN }}
        run: |
          set -euo pipefail
          [[ -n "$SSH_KEY" && -n "$KNOWN_HOSTS" && "$HOST" =~ ^[a-zA-Z0-9.-]+$ ]]
          key_dir=$(mktemp -d)
          trap 'rm -rf "$key_dir"' EXIT
          printf '%s\n' "$SSH_KEY" > "$key_dir/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$key_dir/known_hosts"
          chmod 600 "$key_dir/"*
          opts=(-i "$key_dir/key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -o "UserKnownHostsFile=$key_dir/known_hosts")
          # Firewall changes are asynchronous. Retry only the connection probe,
          # never a deployment that may have partially completed.
          connected=false
          for attempt in $(seq 1 12); do
            if ssh "${opts[@]}" ubuntu@"$HOST" true; then connected=true; break; fi
            sleep 5
          done
          "$connected" || { echo 'SSH connection could not be verified'; exit 1; }
          ssh "${opts[@]}" ubuntu@"$HOST" "mkdir -p /opt/gloceries/releases/$TAG"
          scp "${opts[@]}" backend/deploy/lightsail/{docker-compose.yml,Caddyfile,deploy.sh} "ubuntu@$HOST:/opt/gloceries/releases/$TAG/"
          # Backend Sentry DSN lives in the BACKEND_SENTRY_DSN repo secret and is
          # written into the host's .env (replacing any older line) before the
          # containers restart. Sent on stdin, never in the command or logs.
          if [[ -n "${SENTRY_DSN:-}" ]]; then
            printf '%s' "$SENTRY_DSN" | ssh "${opts[@]}" ubuntu@"$HOST" \
              "set -eu; read -r dsn || true; [[ \"\$dsn\" =~ ^https://[A-Za-z0-9]+@[A-Za-z0-9.-]+/[0-9]+\$ ]] || { echo 'BACKEND_SENTRY_DSN is not a Sentry DSN'; exit 1; }; umask 077; f=/opt/gloceries/.env; { grep -v '^SENTRY_DSN=' \"\$f\" || true; printf 'SENTRY_DSN=%s\\n' \"\$dsn\"; } > \"\$f.next\"; mv \"\$f.next\" \"\$f\""
          fi
          # Ephemeral job token: no persistent registry PAT on the host.
          # The token is sent on stdin, never in the remote command or logs.
          printf '%s' "$GHCR_TOKEN" | ssh "${opts[@]}" ubuntu@"$HOST" \
            "set -eu; export DOCKER_CONFIG=\$(mktemp -d); trap 'rm -rf \"\$DOCKER_CONFIG\"' EXIT; docker login ghcr.io -u '${{ github.actor }}' --password-stdin; bash /opt/gloceries/releases/$TAG/deploy.sh $TAG"

      - name: Health check
        if: ${{ !inputs.build_only }}
        env: {HOST: "${{ secrets.LIGHTSAIL_HOST }}"}
        run: |
          for i in $(seq 1 20); do
            code=$(curl -fsS -o /dev/null -w '%{http_code}' --resolve "${{ vars.API_DOMAIN }}:443:$HOST" "https://${{ vars.API_DOMAIN }}/" || true)
            [ "$code" = "200" ] && echo "API healthy" && exit 0
            sleep 6
          done
          echo "API did not answer 200 after deploy" && exit 1

      - name: Remove this runner's SSH access
        if: ${{ always() && !inputs.build_only && steps.aws.outcome == 'success' && steps.runner.outputs.cidr != '' }}
        env: {RUNNER_CIDR: '${{ steps.runner.outputs.cidr }}'}
        run: python3 backend/deploy/lightsail/ci-ssh-access.py close "$RUNNER_CIDR"
