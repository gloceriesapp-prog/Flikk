name: CI

# Private repo: every minute here is billed past the free 2,000/month, and a
# full run is ~22 job-minutes. A branch push and its pull request used to run
# CI twice per commit, so push runs only for main (Backend → Lightsail waits on
# main's push run). A newer commit cancels the older run of the same PR;
# main's runs are never cancelled.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Which apps a pull request touches, so an admin-only change doesn't build
  # the mobile apps. Pushes to main (merges) always run everything:
  # Backend → Lightsail waits on main's run.
  changes:
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request'
    permissions: {pull-requests: read}
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      sql: ${{ steps.filter.outputs.sql }}
      customer: ${{ steps.filter.outputs.customer }}
      mobile: ${{ steps.filter.outputs.mobile }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            shared: &shared
              - '.github/**'
              - 'scripts/**'
              - 'config/**'
              - 'packages/**'
              - 'package.json'
              - 'package-lock.json'
              - 'patches/**'
            backend:
              - *shared
              - 'backend/**'
              - 'apps/customer/**'
              - 'apps/admin/**'
              - 'apps/partner/**'
              - 'apps/rider/**'
              - 'apps/partner-dashboard/**'
            sql:
              - *shared
              - 'backend/**'
            customer:
              - *shared
              - 'apps/customer/**'
            mobile:
              - *shared
              - 'apps/partner/**'
              - 'apps/rider/**'
            web:
              - *shared
              - 'backend/**'
              - 'apps/admin/**'
              - 'apps/partner-dashboard/**'
              - 'apps/landing/**'

  backend:
    needs: changes
    if: ${{ !cancelled() && (github.event_name == 'push' || (needs.changes.result == 'success' && needs.changes.outputs.backend == 'true')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          # 22, was 20 — undici@8 (backend/src/db/supabase.ts's own Agent/
          # fetch import) throws `webidl.util.markAsUncloneable is not a
          # function` constructing its Cache API on Node 20 (real bug, not
          # a broken package — verified against npm's own published
          # versions), which crashed every test file that transitively
          # imports supabase.ts (auth.test.ts, weeklyPayouts.test.ts) before
          # a single test in them could even run. @supabase/supabase-js
          # already logs its own "Node 20 and below are deprecated, upgrade
          # to Node 22" warning in this same CI output — this makes CI
          # actually run on the version both direct dependencies expect.
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            backend/pnpm-lock.yaml
            apps/admin/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Install partner workspace dependencies for cross-app regression tests
        run: npm ci --no-audit --no-fund
        working-directory: .
      # Several backend tests import shared logic from the customer and admin
      # apps (react-query cache helpers, admin route handlers), so their
      # dependencies must exist for those test files to load.
      - run: npm ci --no-audit --no-fund
        working-directory: apps/customer
      - run: pnpm install --frozen-lockfile --ignore-workspace
        working-directory: apps/admin
      - run: node scripts/migrations.mjs
      - run: pnpm run lint
      - run: pnpm exec tsc --noEmit -p tsconfig.json
      - run: pnpm test
      - run: node --test ../packages/server-media/upload.test.cjs
      - name: Verify native map credential separation for all mobile apps
        run: node --test ../packages/shared/config/google-maps.test.cjs

  commerce-security:
    needs: changes
    if: ${{ !cancelled() && (github.event_name == 'push' || (needs.changes.result == 'success' && needs.changes.outputs.sql == 'true')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      matrix:
        missing_delivery_otp: [false, true]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: flikk_checkout_tests
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d flikk_checkout_tests"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGDATABASE: flikk_checkout_tests
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Verify checkout and real API-role permissions
        run: >-
          psql -X -v ON_ERROR_STOP=1
          -v missing_delivery_otp=${{ matrix.missing_delivery_otp }}
          -f backend/tests/sql/checkout-eligibility.sql
          -f backend/tests/sql/commerce-security.sql
          -f backend/tests/sql/verify-commerce-security.sql
          -f backend/tests/sql/order-safety.sql
          -f backend/tests/sql/verify-order-safety.sql
      - name: Verify concurrent delivery and refund claims
        run: python3 backend/tests/sql/order-safety-concurrency.py
      - name: Verify customer experience migrations and deletion permissions
        run: psql -X -v ON_ERROR_STOP=1 -f backend/tests/sql/customer-experience.sql -f backend/tests/sql/checkout-address-snapshots.sql -f backend/tests/sql/backend-audit.sql

      - name: Verify concurrent rating totals
        run: python3 backend/tests/sql/reviews-concurrency.py
      - name: Rebuild complete application schema from canonical migrations
        if: matrix.missing_delivery_otp == false
        run: |
          createdb flikk_migrations_tests
          PGDATABASE=flikk_migrations_tests node backend/scripts/verify-fresh-migrations.mjs
          PGDATABASE=flikk_migrations_tests psql -X -v ON_ERROR_STOP=1 -f backend/tests/sql/customer-privacy.sql -f backend/tests/sql/customer-policy-sync.sql -f backend/tests/sql/rider-profile-changes.sql -f backend/tests/sql/store-team-access.sql -f backend/tests/sql/checkout-deadline-fixture-defaults.sql
          PGDATABASE=flikk_migrations_tests psql -X -v ON_ERROR_STOP=1 -f backend/tests/sql/security-patch.sql -f backend/tests/sql/browse-visibility.sql -f backend/tests/sql/media-storage.sql -f backend/tests/sql/promotional-deliveries.sql -f backend/tests/sql/verify-rpc-security.sql -f backend/tests/sql/verify-commerce-security.sql -f backend/tests/sql/verify-order-safety.sql
          PGDATABASE=flikk_migrations_tests psql -X -v ON_ERROR_STOP=1 -f backend/tests/sql/razorpay-payments.sql -f backend/tests/sql/trip-dispatch-integrity.sql -f backend/tests/sql/rider-pay-cod.sql -f backend/tests/sql/admin-order-control.sql -f backend/tests/sql/account-controls.sql -f backend/tests/sql/catalogue-stock-integrity.sql -f backend/tests/sql/app-config-hours.sql -f backend/tests/sql/rider-ops.sql -f backend/tests/sql/partner-store-controls.sql -f backend/tests/sql/product-review-commission.sql -f backend/tests/sql/partner-catalogue-submission.sql -f backend/tests/sql/home-content-controls.sql -f backend/tests/sql/customer-commerce-controls.sql -f backend/tests/sql/partner-rider-support.sql -f backend/tests/sql/fleet-push.sql -f backend/tests/sql/rider-earnings-correction.sql -f backend/tests/sql/order-numbers.sql -f backend/tests/sql/dispatch-on-accept.sql -f backend/tests/sql/category-commission.sql -f backend/tests/sql/admin-money-summary.sql -f backend/tests/sql/platform-markup.sql -f backend/tests/sql/product-flavours.sql -f backend/tests/sql/serving-temperature.sql -f backend/tests/sql/preorders.sql -f backend/tests/sql/price-mrp-fallback.sql -f backend/tests/sql/home-section-products.sql -f backend/tests/sql/home-picks-dairy-newest.sql
          PGDATABASE=flikk_migrations_tests python3 backend/tests/sql/razorpay-concurrency.py
          PGDATABASE=flikk_migrations_tests psql -X -v ON_ERROR_STOP=1 -c BEGIN -f backend/tests/store-availability.sql -c ROLLBACK

  customer:
    needs: changes
    if: ${{ !cancelled() && (github.event_name == 'push' || (needs.changes.result == 'success' && needs.changes.outputs.customer == 'true')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/customer
    env:
      EXPO_PUBLIC_API_URL: https://api.example.com
      EXPO_PUBLIC_API_FOLLOW_METRO_HOST: 'false'
      CI: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/customer/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --runInBand --watchman=false
      - name: Bundle both native platforms
        run: npx expo export --platform ios --max-workers 2 --output-dir /tmp/customer-ios
      - run: npx expo export --platform android --max-workers 2 --output-dir /tmp/customer-android

  # Partner and rider apps share the root npm workspace (with packages/*).
  mobile-apps:
    needs: changes
    if: ${{ !cancelled() && (github.event_name == 'push' || (needs.changes.result == 'success' && needs.changes.outputs.mobile == 'true')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      matrix:
        app: [partner, rider]
    env:
      EXPO_PUBLIC_API_URL: https://api.example.com
      CI: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Verify Expo native dependency alignment
        run: npx --yes expo-doctor
        working-directory: apps/${{ matrix.app }}
        env:
          EXPO_NO_DOTENV: '1'
      - run: npx tsc --noEmit
        working-directory: apps/${{ matrix.app }}
      - run: npx eslint .
        working-directory: apps/${{ matrix.app }}
      - name: Set up Java for Partner release policy checks
        if: matrix.app == 'partner'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify Partner release configuration and Android API compatibility
        if: matrix.app == 'partner'
        run: npm run test:android-release-quality
        working-directory: apps/partner
      - name: Verify Partner prebuild and native bytecode transformation
        if: matrix.app == 'partner'
        working-directory: apps/partner
        env:
          EXPO_NO_DOTENV: '1'
        run: |
          npx expo prebuild --platform android --no-install
          ./android/gradlew -p android/buildSrc test --no-daemon --max-workers=2
      - name: Verify Partner notification bitmap ownership and cancellation
        if: matrix.app == 'partner'
        working-directory: apps/partner
        run: ./android/gradlew -p native-release-quality/notification-tests test --no-daemon --max-workers=2
      # Rider's pure decision logic (presence loops, schedules, background
      # location disclosure, order mapping) is covered by runnable self-checks.
      - if: matrix.app == 'rider'
        run: npm test
        working-directory: apps/rider

  # Next.js apps. `next typegen` generates the PageProps/LayoutProps/
  # RouteContext globals that the typecheck relies on.
  web-apps:
    needs: changes
    if: ${{ !cancelled() && (github.event_name == 'push' || (needs.changes.result == 'success' && needs.changes.outputs.web == 'true')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      matrix:
        app: [admin, partner-dashboard, landing]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    # Safe placeholders so `next build` fails on real bundling/code errors, not
    # on missing env. Admin-only vars (service role, admin login) are harmless
    # for the other apps. Deliberately NOT setting VERCEL_ENV/APP_ENV (keeps the
    # landing build-guard from hard-failing) nor NEXT_PUBLIC_API_URL (lets
    # landing's localhost fallback apply) — both intended for CI.
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
      SUPABASE_SERVICE_ROLE_KEY: placeholder
      ADMIN_USERNAME: ci
      ADMIN_LOGIN_EMAIL: ci@example.com
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/${{ matrix.app }}/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --ignore-workspace
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npx eslint src
      # Full build — CI must prove a deployable bundle, not just types/lint.
      # Use each app's own `build` script (admin needs `next build --webpack` for
      # its raw backend/src/*.ts `.js`->`.ts` imports; others are plain next build).
      # --ignore-workspace mirrors the install step: admin/partner-dashboard have a
      # pnpm-workspace.yaml with no `packages:` key, which `pnpm build` otherwise
      # rejects ("packages field missing or empty").
      - run: pnpm --ignore-workspace build


  # One stable check: filtering failures or unexpected skips cannot look green.
  ci-gate:
    if: always()
    needs: [changes, backend, commerce-security, customer, mobile-apps, web-apps]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify CI result aggregation and regression scenarios
        run: node --test scripts/ci-gate.test.mjs
      - name: Require all selected checks to pass
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_NEEDS: ${{ toJSON(needs) }}
        run: node scripts/ci-gate.mjs
